spring:
  application:
    name: doc-mind
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:docmind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:140503}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DocMindHikariPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  # Java Mail Sender Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # AI Configuration
  ai:
    chat:
      client:
        enabled: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL}
      chat:
        model: ${CHAT_MODEL}
        temperature: 0.2
        max-completion-tokens: 2048
      embedding:
        api-key: ${EMBEDDING_KEY}
        base-url: ${EMBEDDING_BASE_URL}
        model: ${EMBEDDING_MODEL}
        dimensions: 2048
    # Vector DB Configuration
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:docmind@vector}
        collection-name: ${QDRANT_COLLECTION_NAME:docmind}
        content-field-name: ${QDRANT_CONTENT_FIELD_NAME:doc_content}
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: true
  # Multi-Part File Configuration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
# RAG Configuration
rag:
  chunking:
    chunk-size: 400
    min-chunk-size-chars: 100
    min-chunk-length-to-embed: 10
    max-num-chunks: 5000
    keep-separator: true
  retrieval:
    top-k: 5
    candidate-k: 20
    similarity-threshold: 0.70
  rewrite:
    api-key: ${REWRITE_KEY}
    base-url: ${REWRITE_BASE_URL}
    chat:
      model: ${REWRITE_MODEL}
      temperature: 0.1
      max-tokens: 512
# JWT Token Configuration
security:
  accessToken:
    expiration: 900
  refreshToken:
    expiration: 86400
  token:
    issuer: docmind
  cookie:
    name:
      refreshTokenName: refreshToken
      accessTokenName: accessToken
    cookieHttpOnly: ${COOKIE_HTTP_ONLY:true}
    cookieSecure: ${COOKIE_SECURE:false}
    cookieSameSite: ${COOKIE_SAME_SITE:lax}
    cookieDomain: ${COOKIE_DOMAIN:localhost}
# DocMind Default Credentials and Cors Configuration
docmind:
  default:
    credential:
      username: ${DEFAULT_ADMIN_USERNAME:admin}
      password: ${DEFAULT_ADMIN_PASSWORD:admin}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      - HEAD
    allowed-headers:
      - Content-Type
      - X-Api-Version
      - X-Conversation-ID
    allow-credentials: true
# Keys Configuration
keys:
  privateKeyPath: ${PRIVATE_KEY_PATH:classpath:key/private_key.pem}
  publicKeyPath: ${PUBLIC_KEY_PATH:classpath:key/public_key.pem}
# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: ${LOG_PATH:backend/logs/doc-mind.log}
  level:
    root: INFO
    com.pranit.docmind: DEBUG
# SafeGuard Configuration
ai:
  advisor:
    safeguard:
      blocked-words:
        - env
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: docmind
    description: "DocMind: Multi-Format document ingestion, vector embeddings with Qdrant and hybrid conversational Q&A with Nvidia."
    version: "1.0.0"
