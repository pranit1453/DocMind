spring:
  application:
    name: doc-mind
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:docmind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DocMindHikariPool
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # Java Mail Sender Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # AI Configuration
  ai:
    chat:
      client:
        enabled: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${CHAT_KEY}
      base-url: ${CHAT_BASE_URL:https://integrate.api.nvidia.com/v1}
      chat:
        model: ${CHAT_MODEL:nvidia/nemotron-3-ultra-550b-a55b}
        temperature: ${CHAT_TEMPERATURE:0.7}
        max-tokens: ${CHAT_MAX_TOKENS:8192}
      embedding:
        api-key: ${EMBEDDING_KEY}
        base-url: ${EMBEDDING_BASE_URL:https://integrate.api.nvidia.com/v1}
        model: ${EMBEDDING_MODEL:nvidia/nemotron-3-embed-1b}
        dimensions: ${EMBEDDING_DIMENSIONS:2048}
    # Vector DB Configuration
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: 6334
        api-key: ${QDRANT_API_KEY}
        collection-name: docmind
        content-field-name: doc_content
        use-tls: false
        initialize-schema: true
  # Multi-Part File Configuration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
# RAG Configuration
rag:
  chunking:
    chunk-size: 600
    min-chunk-size-chars: 200
    min-chunk-length-to-embed: 20
    max-num-chunks: 5000
    keep-separator: true
  retrieval:
    top-k: 5
    candidate-k: 20
    similarity-threshold: 0.70
# JWT Token Configuration
security:
  accessToken:
    expiration: ${ACCESS_TOKEN_EXPIRATION:900}
  refreshToken:
    expiration: ${REFRESH_TOKEN_EXPIRATION:86400}
  token:
    issuer: ${TOKEN_ISSUER:docmind}
  cookie:
    name:
      refreshTokenName: ${REFRESH_TOKEN_COOKIE_NAME:refreshToken}
      accessTokenName: ${ACCESS_TOKEN_COOKIE_NAME:accessToken}
    cookieHttpOnly: ${COOKIE_HTTP_ONLY:true}
    cookieSecure: ${COOKIE_SECURE:false}
    cookieSameSite: ${COOKIE_SAME_SITE:lax}
    cookieDomain: ${COOKIE_DOMAIN:localhost}
# Default Credentials
docmind:
  default:
    credential:
      username: ${DEFAULT_ADMIN_USERNAME:admin}
      password: ${DEFAULT_ADMIN_PASSWORD:admin}
# Keys Configuration
keys:
  privateKeyPath: ${PRIVATE_KEY_PATH:key/private_key.pem}
  publicKeyPath: ${PUBLIC_KEY_PATH:key/public_key.pem}
# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
# Logging Configuration
logging:
  file:
    name: logs/doc-mind.log
  level:
    root: INFO
    com.pranit.accesshub: DEBUG
# SafeGuard Configuration
ai:
  advisor:
    safeguard:
      blocked-words:
        - env
#DocMind Cors Configuration
app:
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
      - HEAD
    allowed-headers:
      - X-Conversation-ID
      - X-Api-Version
      - Content-Type
    allow-credentials: true
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: docmind
    description: "DocMind: Multi-Format document ingestion, vector embeddings with Qdrant and hybrid conversational Q&A with Nvidia."
    version: "1.0.0"