services:
  postgres:
    image: postgres:18
    container_name: doc-mind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docmind@
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U postgres -d docmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
